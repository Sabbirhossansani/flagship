server:
  port: 8081

spring:
  application:
    name: flagship-demo-app

flagship:
  enabled: true
  server-url: http://localhost:8080
  project-key: default
  environment-key: production
  api-key: fs_dev_bootstrap_key
  polling-interval: 30s
  sse-enabled: false
  disk-persistence-enabled: true
  disk-persistence-path: ./target/.demo-cache.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,flagship
