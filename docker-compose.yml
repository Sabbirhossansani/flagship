services:
  postgres:
    image: postgres:16-alpine
    container_name: flagship-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flagship}
      POSTGRES_USER: ${POSTGRES_USER:-flagship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flagship_dev_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - flagship_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flagship} -d ${POSTGRES_DB:-flagship}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  flagship-server:
    build:
      context: .
      dockerfile: flagship-server/Dockerfile
    container_name: flagship-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flagship}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flagship}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-flagship_dev_secret}
      FLAGSHIP_SECURITY_JWT_SECRET: ${FLAGSHIP_JWT_SECRET:-flagship-local-dev-jwt-signing-key-at-least-32-bytes}
      FLAGSHIP_SECURITY_ADMIN_USERNAME: ${FLAGSHIP_ADMIN_USERNAME:-admin}
      FLAGSHIP_SECURITY_ADMIN_PASSWORD: ${FLAGSHIP_ADMIN_PASSWORD:-admin_dev_password}
      FLAGSHIP_SECURITY_BOOTSTRAP_API_KEY: ${FLAGSHIP_API_KEY:-fs_dev_bootstrap_key}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
    ports:
      - "${FLAGSHIP_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  flagship-admin-web:
    build:
      context: .
      dockerfile: flagship-admin-web/Dockerfile
    container_name: flagship-admin-web
    restart: unless-stopped
    depends_on:
      flagship-server:
        condition: service_healthy
    environment:
      FLAGSHIP_API_BASE_URL: http://flagship-server:8080
    ports:
      - "${FLAGSHIP_ADMIN_WEB_PORT:-3000}:80"
    deploy:
      resources:
        limits:
          memory: 128M

  flagship-demo-app:
    build:
      context: .
      dockerfile: flagship-demo-app/Dockerfile
    container_name: flagship-demo-app
    restart: unless-stopped
    depends_on:
      flagship-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      FLAGSHIP_CLIENT_SERVER_URL: http://flagship-server:8080
      FLAGSHIP_CLIENT_API_KEY: ${FLAGSHIP_API_KEY:-fs_dev_bootstrap_key}
      FLAGSHIP_CLIENT_PROJECT_KEY: default
      FLAGSHIP_CLIENT_ENVIRONMENT_KEY: production
      FLAGSHIP_CLIENT_SNAPSHOT_PATH: /tmp/flagship-snapshot.json
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
    ports:
      - "${FLAGSHIP_DEMO_APP_PORT:-8082}:8082"
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  flagship_pgdata:
